name: test

# Run unit tests for both stacks on every push to dev/main and on pull
# requests. The Go runtime has 50+ `_test.go` files; the web UI gained a
# vitest entrypoint in #<this PR> so the `pnpm test` step has something
# to run. Both steps exit non-zero on failure, so a red check here means
# the branch is unsafe to merge.
#
# Triggers mirror the build-and-push workflow: pushes to dev/main and
# all PRs targeting those branches. Releases (`v*` tags) and the docker
# build workflow are deliberately NOT triggered here — the release
# pipeline already builds binaries and would be slowed down by running
# the full test suite twice.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  go-tests:
    name: Go (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run Go tests
        run: make test

  web-tests:
    name: Web (pnpm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test

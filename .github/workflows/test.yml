name: test

# Run unit tests for both stacks on every push to dev/main and on pull
# requests. The Go runtime has 50+ `_test.go` files; the web UI ships a
# vitest entrypoint (`pnpm test`) so the `web-tests` job has something
# to run. Both jobs exit non-zero on failure, so a red check here means
# the branch is unsafe to merge.
#
# Triggers mirror the build-and-push workflow: pushes to dev/main and
# all PRs targeting those branches. Releases (`v*` tags) and the docker
# build workflow are deliberately NOT triggered here — the release
# pipeline already builds binaries and would be slowed down by running
# the full test suite twice.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  go-tests:
    name: Go (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # `internal/setup/embed.go` does `//go:embed all:web` over the
      # built Next.js output. That directory is gitignored, so a fresh
      # checkout can't compile any package that imports it — including
      # the setup tests. Build the web first so the embed pattern has
      # something to match. This is the same dance release.yml does
      # before `go build`. The pnpm cache below keeps subsequent runs
      # to a few seconds.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI (provides internal/setup/web for go:embed)
        run: make build-web

      - name: Run Go tests
        run: make test

  web-tests:
    name: Web (pnpm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
